name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: workflow-tests
          create-args: >-
            python=3.11
            pip
            samtools=1.19
            -c conda-forge -c bioconda
          cache-environment: true
      - name: Install workflow and report test dependencies
        shell: bash -el {0}
        run: |
          python -m pip install 'snakemake==7.32.4' 'pulp<2.8' \
            'peppy==0.40.4' 'peds==1.3.2' 'eido==0.1.9' \
            'igv-reports==1.17.0' 'pysam==0.23.3'
      - name: Fetch pinned offline viewer asset
        shell: bash -el {0}
        run: |
          curl --fail --location --retry 3 \
            https://cdn.jsdelivr.net/npm/igv@3.5.2/dist/igv.min.js \
            --output "$RUNNER_TEMP/igv.3.5.2.min.js"
      - name: Synthetic workflow and scientific-data regressions
        shell: bash -el {0}
        env:
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          export IGV_REPORTS_TEST_JS="$RUNNER_TEMP/igv.3.5.2.min.js"
          python -m unittest discover -s tests -v
      - name: Check patch whitespace
        run: git diff --check
