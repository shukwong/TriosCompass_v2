description: Self-contained FASTQ PEP schema; lanes 1 through 8.
properties:
  samples:
    type: array
    items:
      type: object
      properties:
        SAMPLE_ID:
          type: string
          description: sample id
        FLOWCELL:
          type: string
          description: Flowcell
        INDEX:
          type: string
          description: Library index
        LANE:
          type: string
          description: Lane number in flowcell
          enum:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'
          - '7'
          - '8'
        R1:
          type: string
          description: path to the R1 fastq file
        R2:
          type: string
          description: path to the R2 fastq file
        LIBRARY_ID:
          type: string
          description: Optional library identifier
      required:
      - FLOWCELL
      - SAMPLE_ID
      - INDEX
      - LANE
      - R1
      - R2
  config:
    properties:
      name:
        type: string
        pattern: ^\S*$
        description: Project name with no whitespace
      pep_version:
        description: Version of the PEP Schema this PEP follows
        type: string
      sample_table:
        type: string
        description: Path to the sample annotation table with one row per sample
      subsample_table:
        type: string
        description: Path to the subsample annotation table with one row per subsample
          and sample_name attribute matching an entry in the sample table
      sample_modifiers:
        type: object
        properties:
          append:
            type: object
          duplicate:
            type: object
          imply:
            type: array
            items:
              type: object
              properties:
                if:
                  type: object
                then:
                  type: object
          derive:
            type: object
            properties:
              attributes:
                type: array
                items:
                  type: string
              sources:
                type: object
        project_modifiers:
          type: object
          properties:
            amend:
              description: Object overwriting original project attributes
              type: object
            import:
              description: List of external PEP project config files to import
              type: array
              items:
                type: string
    required:
    - pep_version
