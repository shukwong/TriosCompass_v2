# Snakemake 7 profile; share the existing submission helpers.
cluster-cancel: scancel
jobscript: ../slurm/slurm-jobscript.sh
cluster: ../slurm/slurm-submit.py
cluster-status: ../slurm/slurm-status.py
snakefile: workflow/Snakefile
verbose: true
skip-script-cleanup: true
latency-wait: 60
reason: true
show-failed-logs: true
keep-going: true
printshellcmds: true
rerun-incomplete: true
use-conda: true
use-envmodules: true
use-singularity: true
local-cores: 1
restart-times: '0'
jobname: '{rule}.{jobid}'
max-jobs-per-second: 1
max-status-checks-per-second: 1
jobs: 100
set-resources:
- bwa_index:mem_mb=16000
- fastp:mem_mb=20000
- fastp:runtime=600
- fastqc:mem_mb=10000
- fastq_screen:mem_mb=50000
- fq2bam:mem_mb=40000
- fq2bam:runtime=480
- fq2bam:partition=gpu
- fq2bam:slurm=gres=gpu:a100:1
- flagstat:mem_mb=80000
- collectwgsmetrics:runtime=1440
- collectwgsmetrics:mem_mb=80000
- collectmultiplemetrics:mem_mb=80000
- collectmultiplemetrics:runtime=2160
- collectmultiplemetrics:partition=gpu
- collectmultiplemetrics:slurm=gres=gpu:a100:1
- gatkhc_pb:mem_mb=200000
- gatkhc_pb:runtime=1200
- gatkhc_pb:partition=gpu
- gatkhc_pb:slurm=gres=gpu:a100:1
- gatk_combine_gvcf:mem_mb=10000
- gatk_combine_gvcf:runtime=720
- gatk_cgp:mem_mb=10000
- gatk_genotype_gvcf_pb:partition=gpu
- gatk_genotype_gvcf_pb:slurm=gres=gpu:a100:1
- deepvariant_pb:mem_mb=180000
- deepvariant_pb:runtime=1800
- deepvariant_pb:slurm=gres=gpu:a100:1
- deepvariant_pb:partition=gpu
- glnexus_dv:mem_mb=200000
- glnexus_dv:runtime=1440
- aggregate_phase:mem_mb=100000
- call_JIGV:mem_mb=60000
- replace_rg:mem_mb=40000
- replace_rg:runtime=1440
- phase_trios:runtime=720
- split_bed_hipstr:mem_mb=10000
- hipstr:mem_mb=40000
- hipstr:runtime=1080
- dumpstr_call_hipstr:mem_mb=40000
- dumpstr_locus:mem_mb=40000
- dumpstr_locus:runtime=1200
- monstr:mem_mb=40000
- monstr:runtime=1200
- merge_monstr:mem_mb=20000
- merge_monstr:runtime=1200
- monstr_filter:mem_mb=10000
- manta_create_run_script:mem_mb=10000
- manta_call:mem_mb=60000
- manta_call:runtime=10080
- run_manta_joint_call:mem_mb=60000
- run_manta_joint_call:runtime=10080
- uniq_svid:mem_mb=40000
- svimmer:runtime=1440
- svimmer:mem_mb=60000
- graphtyper:runtime=4320
- graphtyper:mem_mb=120000
- graphtyper_filter:mem_mb=20000
- smoove:runtime=1440
- smoove:mem_mb=100000
- scatter_dnms:runtime=1440
default-resources:
- mem_mb=4000
- runtime=600
- partition=norm
